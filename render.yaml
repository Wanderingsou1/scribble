services:
  - type: web
    name: skribbl-clone-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render — do not set it here.
      - key: DATABASE_URL
        fromDatabase:
          name: skribbl-db
          property: connectionString # resolves to the Internal URL
      # Not read by the code today (CORS is wildcard in src/index.js).
      # Set to your deployed frontend URL if you tighten CORS later.
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: skribbl-clone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Build-time only. Set to the backend's full URL including https://,
      # e.g. https://skribbl-clone-backend.onrender.com
      # Changing it requires a redeploy, not just a restart.
      - key: VITE_BACKEND_URL
        sync: false
    routes:
      # SPA fallback so /room/:code deep links don't 404
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: skribbl-db
    databaseName: skribbl_db_rmrt
    plan: free
    region: oregon
